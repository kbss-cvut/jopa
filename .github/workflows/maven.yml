name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master, development, release/** ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 25
          cache: maven
      - name: Build with Maven
        run: mvn -P javadoc -B package --file pom.xml
